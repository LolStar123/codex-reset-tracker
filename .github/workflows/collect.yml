name: Collect reset updates
on:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'data/**'
      - 'scripts/github-collect.ts'
      - '.github/workflows/collect.yml'
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: reset-collection
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: monitor-data
          path: state
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build:collector
      - name: Collect posts and replies
        id: collect
        continue-on-error: true
        run: node dist-collector/collect.mjs state
      - name: Publish snapshot and health logs
        if: ${{ always() && steps.collect.outcome != 'skipped' }}
        working-directory: state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add snapshot.json raw-posts.json runs.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record source check'
            git push origin HEAD:monitor-data
          fi
      - name: Report source failure
        if: ${{ steps.collect.outcome == 'failure' }}
        run: |
          echo 'Collection failed. Previous data and the failure receipt have been retained.'
          exit 1
